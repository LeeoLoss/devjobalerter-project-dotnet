services:
  # 1. Database for Evolution API
  postgres:
    image: postgres:15-alpine
    container_name: devjobalerter_postgres
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_pass
      - POSTGRES_DB=evolution_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devjobalerter-network

  # 2. WhatsApp API Service
  whatsapp-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=akxp0209
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://evolution:evolution_pass@postgres:5432/evolution_db
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
    depends_on:
      - postgres
    volumes:
      - whatsapp_instances:/evolution/instances
    networks:
      - devjobalerter-network

  # 3. Worker Service (.NET 10)
  devjobalerter-worker:
    build:
      context: .
      dockerfile: backend/src/DevJobAlerter.Worker/Dockerfile
    container_name: devjobalerter_worker
    restart: always
    depends_on:
      - whatsapp-api
    networks:
      - devjobalerter-network

networks:
  devjobalerter-network:
    driver: bridge

volumes:
  postgres_data:
  whatsapp_instances: